<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài khoản - V.K Global Shop</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .auth-container {
      max-width: 480px;
      margin: 60px auto;
      padding: 40px;
      background: var(--panel);
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-elevated);
      position: relative;
      overflow: hidden;
    }

    .auth-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, var(--brand-light) 0%, transparent 60%);
      z-index: 0;
      pointer-events: none;
    }

    .auth-content {
      position: relative;
      z-index: 1;
    }

    .auth-tabs {
      display: flex;
      background: var(--bg);
      padding: 6px;
      border-radius: 14px;
      margin-bottom: 30px;
      border: 1px solid var(--border);
    }

    .auth-tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-weight: 800;
      font-size: 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--muted);
    }

    .auth-tab.active {
      background: var(--panel);
      color: var(--brand);
      box-shadow: var(--shadow);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px var(--brand-light);
    }

    .strength-meter {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }

    .strength-bar {
      height: 100%;
      width: 0;
      transition: all 0.3s ease;
    }
  </style>
</head>

<body>

  <header>
    <div class="container nav-bar">
      <a href="index.html" class="logo">⚡ V.K Global</a>
      <nav class="nav-links">
        <a href="index.html">Trang chủ</a>
        <a href="index.html#projects-section">Dự án</a>
        <a href="index.html#products-section">Linh kiện</a>
        <a href="cart.html">Giỏ hàng (<span id="cart-badge">0</span>)</a>
        <a href="account.html" class="active">Tài khoản</a>
      </nav>
      <div class="nav-actions">
        <button id="dark-toggle" class="btn btn-secondary">🌙</button>
        <div id="user-nav"></div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="auth-container">
      <div class="auth-content">
        <div class="auth-tabs">
          <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Đăng nhập</div>
          <div class="auth-tab" id="tab-register" onclick="switchTab('register')">Đăng ký</div>
        </div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleAuth(event, 'login')">
          <div class="form-group">
            <label>Email của bạn</label>
            <input type="email" class="form-control" placeholder="name@vkglobal.vn" required id="login-email">
          </div>
          <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" class="form-control" placeholder="••••••••" required id="login-password">
          </div>
          <button type="submit" class="btn btn-primary"
            style="width: 100%; justify-content: center; padding: 14px; margin-top: 10px;">
            Đăng nhập ngay
          </button>
        </form>

        <!-- Register Form -->
        <form id="register-form" onsubmit="handleAuth(event, 'register')" style="display: none;">
          <div class="form-group">
            <label>Họ và tên</label>
            <input type="text" class="form-control" placeholder="Nguyễn Văn A" required id="reg-name">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" class="form-control" placeholder="name@vkglobal.vn" required id="reg-email">
          </div>
          <div class="form-group">
            <label>Số điện thoại</label>
            <input type="tel" class="form-control" placeholder="0987654321" required id="reg-phone">
          </div>
          <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" class="form-control" placeholder="••••••••" required id="reg-password"
              oninput="checkPasswordStrength(this.value)">
            <div class="strength-meter">
              <div class="strength-bar" id="strength-bar"></div>
            </div>
            <span id="strength-text" style="font-size: 12px; font-weight: 700; margin-top: 4px; display: block;"></span>
          </div>
          <button type="submit" class="btn btn-primary"
            style="width: 100%; justify-content: center; padding: 14px; margin-top: 10px;">
            Tạo tài khoản mới
          </button>
        </form>

        <!-- User Profile & Order History (Visible when logged in) -->
        <div id="user-profile-section" style="display: none; margin-top: 20px;">
          <div style="text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border);">
            <div id="user-avatar" style="width: 80px; height: 80px; border-radius: 50%; background: var(--brand); color: white; font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; box-shadow: var(--shadow);">U</div>
            <h3 id="user-name-display" style="font-size: 20px; font-weight: 800; margin-bottom: 5px;">Tên người dùng</h3>
            <p id="user-email-display" style="color: var(--muted); font-size: 14px; font-weight: 600;">email@vkglobal.vn</p>
            <button onclick="handleLogout()" class="btn btn-secondary" style="margin-top: 15px; padding: 8px 20px; font-size: 13px;">Đăng xuất</button>
          </div>

          <div>
            <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">📦 Lịch sử đơn hàng</h3>
            <div id="orders-list" style="display: flex; flex-direction: column; gap: 15px;">
              <!-- Orders will be rendered here -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>© 2025 V.K Global Shop. Bảo lưu mọi quyền.</p>
    </div>
  </footer>

  <script src="js/services.js"></script>
  <script src="js/main.js"></script>
  <script>
    function switchTab(mode) {
      const tabLogin = document.getElementById("tab-login");
      const tabRegister = document.getElementById("tab-register");
      const formLogin = document.getElementById("login-form");
      const formRegister = document.getElementById("register-form");

      if (mode === 'login') {
        tabLogin.classList.add("active");
        tabRegister.classList.remove("active");
        formLogin.style.display = "block";
        formRegister.style.display = "none";
      } else {
        tabLogin.classList.remove("active");
        tabRegister.classList.add("active");
        formLogin.style.display = "none";
        formRegister.style.display = "block";
      }
    }

    function checkPasswordStrength(password) {
      const bar = document.getElementById("strength-bar");
      const text = document.getElementById("strength-text");
      if (!bar || !text) return;

      if (!password) {
        bar.style.width = "0%";
        text.textContent = "";
        return;
      }

      let score = 0;
      if (password.length >= 6) score++;
      if (/[A-Z]/.test(password)) score++;
      if (/[0-9]/.test(password)) score++;
      if (/[^A-Za-z0-9]/.test(password)) score++;

      if (score <= 1) {
        bar.style.width = "33%";
        bar.style.background = "var(--signal)";
        text.textContent = "Yếu 🔴";
        text.style.color = "var(--signal)";
      } else if (score === 2 || score === 3) {
        bar.style.width = "66%";
        bar.style.background = "var(--copper)";
        text.textContent = "Trung bình 🟡";
        text.style.color = "var(--copper)";
      } else {
        bar.style.width = "100%";
        bar.style.background = "var(--limewire)";
        text.textContent = "Mạnh 🟢";
        text.style.color = "var(--limewire)";
      }
    }

    async function handleAuth(e, mode) {
      e.preventDefault();
      if (mode === 'login') {
        const email = document.getElementById("login-email").value;
        const password = document.getElementById("login-password").value;
        const res = await authService.login(email, password);
        if (res.success) {
          const role = res.data?.role;
          if (role === 'admin') {
            showToast("👋 Chào mừng Admin!");
            setTimeout(() => { window.location.href = 'admin.html'; }, 500);
          } else {
            showToast("👋 Đăng nhập thành công!");
            setTimeout(() => { window.location.href = 'index.html'; }, 500);
          }
        } else {
          showToast("❌ " + res.message);
        }
      } else {
        const name = document.getElementById("reg-name").value;
        const email = document.getElementById("reg-email").value;
        const phone = document.getElementById("reg-phone").value;
        const password = document.getElementById("reg-password").value;
        const res = await authService.register(name, email, password, phone);
        if (res.success) {
          showToast("🎉 Đăng ký tài khoản thành công! Hãy đăng nhập.");
          switchTab('login');
        } else {
          showToast("❌ " + res.message);
        }
      }
    }

    function handleLogout() {
      authService.logout();
      showToast("👋 Đã đăng xuất tài khoản.");
      renderNavbarUser();
      checkLoginState();
    }

    async function checkLoginState() {
      const user = authService.getCurrentUser();
      const tabLogin = document.getElementById("tab-login");
      const tabRegister = document.getElementById("tab-register");
      const authTabs = document.querySelector(".auth-tabs");
      const formLogin = document.getElementById("login-form");
      const formRegister = document.getElementById("register-form");
      const profileSection = document.getElementById("user-profile-section");

      if (user) {
        // Logged in
        if (authTabs) authTabs.style.display = "none";
        if (formLogin) formLogin.style.display = "none";
        if (formRegister) formRegister.style.display = "none";
        if (profileSection) profileSection.style.display = "block";

        document.getElementById("user-name-display").textContent = user.name;
        document.getElementById("user-email-display").textContent = user.email;
        document.getElementById("user-avatar").textContent = user.name[0].toUpperCase();

        // Load and render orders
        const ordersList = document.getElementById("orders-list");
        if (ordersList) {
          ordersList.innerHTML = `<p style="text-align: center; color: var(--muted);">⏳ Đang tải lịch sử đơn hàng...</p>`;
          const orders = await orderService.getMyOrders();
          if (orders && orders.length > 0) {
            ordersList.innerHTML = orders.map(order => {
              const itemsHtml = order.items.map(item => `
                <div style="display: flex; align-items: center; gap: 12px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);">
                  <img src="${item.product_image}" alt="${item.product_name}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 8px;">
                  <div style="flex: 1;">
                    <h4 style="font-size: 14px; font-weight: 700; margin-bottom: 2px;">${item.product_name}</h4>
                    <p style="font-size: 12px; color: var(--muted); font-weight: 600;">Số lượng: ${item.quantity} x ${formatCurrency(item.price)}</p>
                  </div>
                </div>
              `).join("");

              return `
                <div class="card" style="padding: 20px; border-radius: 16px; border: 1px solid var(--border); background: var(--bg);">
                  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px;">
                    <div>
                      <span style="font-size: 12px; color: var(--muted); font-weight: 700;">MÃ ĐƠN HÀNG</span>
                      <h4 style="font-size: 16px; font-weight: 800; color: var(--brand);">${order.order_code}</h4>
                    </div>
                    <span style="font-size: 12px; background: var(--brand-light); color: var(--brand); padding: 6px 12px; border-radius: 20px; font-weight: 800;">
                      ${order.status}
                    </span>
                  </div>
                  <p style="font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 10px;">📅 Ngày đặt: ${new Date(order.created_at).toLocaleDateString("vi-VN")}</p>
                  <p style="font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 10px;">📍 Địa chỉ: ${order.shipping_address}</p>
                  
                  ${itemsHtml}

                  <div style="margin-top: 15px; padding-top: 15px; border-top: 2px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 14px; font-weight: 700; color: var(--muted);">Tổng thanh toán:</span>
                    <span style="font-size: 18px; font-weight: 800; color: var(--brand);">${formatCurrency(order.total_amount)}</span>
                  </div>
                </div>
              `;
            }).join("");
          } else {
            ordersList.innerHTML = `<p style="text-align: center; color: var(--muted); padding: 20px 0;">📦 Bạn chưa có đơn hàng nào.</p>`;
          }
        }
      } else {
        // Logged out
        if (authTabs) authTabs.style.display = "flex";
        if (formLogin) formLogin.style.display = "block";
        if (formRegister) formRegister.style.display = "none";
        if (profileSection) profileSection.style.display = "none";
        switchTab('login');
      }
    }

    document.addEventListener("DOMContentLoaded", checkLoginState);
  </script>
</body>

</html>
