<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh toán đã hủy - V.K Global Shop</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <div class="container nav-bar">
      <a href="index.html" class="logo">⚡ V.K Global</a>
      <nav class="nav-links">
        <a href="index.html">Trang chủ</a>
        <a href="account.html">Tài khoản</a>
      </nav>
      <div class="nav-actions">
        <button id="dark-toggle" class="btn btn-secondary">🌙</button>
        <div id="user-nav"></div>
      </div>
    </div>
  </header>

  <main class="checkout-page" style="min-height: 60vh; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 520px; width: 100%; padding: 48px 40px; text-align: center; border-radius: 20px;">
      <div style="font-size: 72px; margin-bottom: 20px;">😔</div>
      <h1 style="font-size: 24px; font-weight: 800; margin-bottom: 8px;">Thanh toán đã hủy</h1>
      <p style="color: var(--muted); font-size: 15px; margin-bottom: 6px;">Bạn đã hủy quá trình thanh toán PayOS.</p>
      <p style="color: var(--muted); font-size: 14px; margin-bottom: 28px;">Đơn hàng vẫn được lưu. Bạn có thể thanh toán lại sau trong mục Tài khoản.</p>
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a href="checkout.html" class="btn btn-primary" style="padding: 12px 28px;">Thử lại</a>
        <a href="account.html" class="btn btn-secondary" style="padding: 12px 28px;">Xem đơn hàng</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>© 2025 V.K Global Shop. Bảo lưu mọi quyền.</p>
    </div>
  </footer>

  <script src="js/services.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
